[project]
name = "bnbLpRangeRebalancer-agent"

[stack]
# Project-lifetime facts: which framework / runtime adapter recipes this
# Agent was scaffolded against. doctor / dev / deploy read these to know
# what to check, load, and route. framework: adk; runtime: agentcore | azure-foundry.
framework = "adk"
runtime = "agentcore"
# External protocol this runtime serves (one runtime, one signer):
#   A2A — serve_a2a: agent card + negotiate/notify_funded skills.
#   MCP — FastMCP on /mcp: negotiate (signed quote) + notify_funded (verify →
#         deliver → submit, synchronously within the tool call) + read-only chain
#         tools. MCP delivery runs in-call (≤ ~15 min); the runtime is stateful.
protocol = "A2A"

[network]
default = "bsc-mainnet"

[wallet]
# Local keystore signer. The Agent is the SOLE key-holder/signer.
# The keystore lives at the WORKSPACE root — outside app/agent (the AgentCore
# codeLocation) — so no packaging path can bundle it into a deploy artifact.
kind = "evm-local"
signer = "local"
keystore_dir = "../../.studio/wallets"
# address = "0x..."   # filled by `bag wallet new`
address = "0x20f1cA5d1e5A3Ee94C29DbF95e6BF6ceA6a8d64b"

[llm]
provider = "openrouter"
model = "openai/gpt-4o-mini"

[payments.erc8183]
# Read by the Agent: it quotes the FIXED `price`, CLAMPS it to [min,max],
# freezes a short-TTL offer, and EIP-191 signs it — pricing is rule-based, the
# LLM never prices.
currency = "0xcE24439F2D9C6a2289F741120FE202248B666666"   # $U token on bsc-MAINNET (chain 56).
# MUST match [network].default. Switching networks does NOT update this line,
# and a stale value makes the agent sign quotes for one chain denominated in a
# token that only exists on the other — a signed, worthless quote (B7). The
# mainnet token is 0xcE24439F2D9C6a2289F741120FE202248B666666 (chain 56).
# check_config_consistency() compares the two at boot rather than trusting it.
price = "100000000000000000"                   # wei — your list price (0.1 U); what every quote charges
min_price = "0"                                # wei — clamp floor
max_price = "1000000000000000000"              # wei — clamp ceiling (1 U = 10x list price)
quote_ttl_seconds = 900                        # seconds a signed quote stays valid; SDK caps at 900 (~15min work window)
default_estimated_completion_seconds = 600
poll_interval_seconds = 30
auto_settle = false                            # opt-in: detect dispute-window-elapsed → settle

[strategy]
# LP rebalancer parameters (spec 4.3: "strategy parameters should be
# configurable"). Read by pancake.py; edit here, not in code.
pair = "BNB/USDT"
fee = 500                  # pool fee tier in hundredths of a bip (500 = 0.05%)

# Token IDs are per-network: an ID minted on one chain names a different (or
# missing) position on the other. Listing both means switching chains is just
# $BNB_NETWORK — no edit here, which is what kept drifting when it was one line.
# INLINE table on purpose: a [strategy.token_ids] header would capture every
# key below it, silently moving range_pct/trigger_pct/slippage out of [strategy].
token_ids = { bsc-mainnet = 7116214, bsc-testnet = 36799 }

range_pct = 10.0           # target range half-width: +/-10% around spot
trigger_pct = 5.0          # rebalance when price is within 5% OF RANGE WIDTH
                           # of either bound (spec 4.3: 630-770 -> 637/763)
mint_slippage_pct = 1.0    # floor on the mint deposit, vs the PREDICTED amounts
max_slippage_pct = 1.0     # swap guard; the testnet pool is shallow enough that
                           # 1 BNB moves it ~44%, so keep test sizes small

[storage]
# Deliverables written to local disk (file://). Offline-dev only —
# does NOT survive deploy. Path from STORAGE_LOCAL_PATH.
kind = "local"

[identity]
# Written by `bag erc8004 register`. Records the MAINNET registration (265375);
# the agent_id is per-network and testnet is 1796.
#
# The agentURI is MUTABLE — setAgentURI replaces the whole document, so name,
# description and endpoint are all fixable in place on the same agent id.
# Mainnet was repointed here from http://localhost:9000/... in tx 0x5e6fb704.
#
# NOTE the CLI can no longer reach this agent: `bag erc8004 update-endpoint`
# finds it via the 8004scan indexer, which only scans the newest ~1000 agents,
# and 265375 has aged out — `bag erc8004 show --network bsc-mainnet` reports
# "no registered agent" for a token that reads fine on-chain. Update it by
# token id through the library instead (see DOCUMENTATION.md 4.12).
endpoint = "https://bnb-lp.172-104-171-139.nip.io/.well-known/agent-card.json"
registered_at = "2026-08-12T09:16:09.598559+00:00"
agent_id = 265375
