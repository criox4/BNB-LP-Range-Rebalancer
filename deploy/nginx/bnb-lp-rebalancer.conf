# nginx site for the BNB LP Range Rebalancer, terminating TLS on the VPS host.
#
#   cp deploy/nginx/bnb-lp-rebalancer.conf /etc/nginx/sites-available/
#   ln -s /etc/nginx/sites-available/bnb-lp-rebalancer.conf /etc/nginx/sites-enabled/
#   nginx -t && systemctl reload nginx
#   certbot --nginx -d bnb-lp.172-104-171-139.nip.io -d bnb-lp-api.172-104-171-139.nip.io
#
# Ships HTTP-only on purpose. `certbot --nginx` EDITS THESE BLOCKS IN PLACE to
# add `listen 443 ssl`, the cert paths and the HTTP->HTTPS redirect, and it can
# only do that to a config nginx already loads. A 443 block with placeholder
# cert paths fails `nginx -t`, so certbot never runs and you are stuck.
#
# TWO hostnames, because the two layers are two processes with two audiences:
#
#   bnb-lp.     -> :9000  the A2A seller. THIS hostname is published on-chain by
#                         submit_result as {ERC8183_AGENT_URL}/job/{id}/response
#                         and is what buyers resolve the agent card from. It must
#                         match ERC8183_AGENT_URL exactly and must never change
#                         while any submitted job is unsettled.
#   bnb-lp-api. -> :8080  the operator/marketplace REST surface.
#
# One hostname with path routing would also work, but /health belongs to the
# service and /ping to the agent, and a mis-scoped location silently answers
# from the wrong process.

upstream bnb_lp_agent {
    # docker-compose binds these on loopback only (docker's iptables rules run
    # ahead of ufw, so a 0.0.0.0 publish would be world-reachable regardless of
    # the firewall). nginx is deliberately the only thing that can reach them.
    server 127.0.0.1:9000;
    keepalive 16;
}

upstream bnb_lp_service {
    server 127.0.0.1:8080;
    keepalive 16;
}

# ---- Agent Layer: A2A seller + ERC-8183 deliverables ------------------------
server {
    server_name bnb-lp.172-104-171-139.nip.io;

    location /.well-known/acme-challenge/ { root /var/www/html; }

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options        "DENY" always;
    add_header Referrer-Policy        "no-referrer" always;
    server_tokens off;

    access_log /var/log/nginx/bnb-lp-agent.access.log;
    error_log  /var/log/nginx/bnb-lp-agent.error.log;

    client_max_body_size 1m;

    location = /ping {
        proxy_pass http://bnb_lp_agent;
        proxy_set_header Host $host;
        access_log off;
    }

    location / {
        proxy_pass http://bnb_lp_agent;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";

        # notify_funded acks fast and does the LLM work in the background, so
        # these are short requests. The generous read timeout is for negotiate,
        # which signs against a live RPC read.
        proxy_connect_timeout 10s;
        proxy_send_timeout    120s;
        proxy_read_timeout    120s;
    }

    listen 80;
    listen [::]:80;
}

# ---- Service Layer: REST -----------------------------------------------------
server {
    server_name bnb-lp-api.172-104-171-139.nip.io;

    location /.well-known/acme-challenge/ { root /var/www/html; }

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options        "DENY" always;
    add_header Referrer-Policy        "no-referrer" always;
    server_tokens off;

    access_log /var/log/nginx/bnb-lp-service.access.log;
    error_log  /var/log/nginx/bnb-lp-service.error.log;

    client_max_body_size 1m;

    location = /health {
        proxy_pass http://bnb_lp_service;
        proxy_set_header Host $host;
        access_log off;
    }

    location / {
        proxy_pass http://bnb_lp_service;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";

        # POST /execute runs a rebalance: withdraw, collect, swap, mint, verify —
        # four transactions and their receipts. Cutting that off at nginx's 60s
        # default returns 504 for work the agent goes on to finish, and the
        # caller then retries a rebalance that already happened.
        proxy_connect_timeout 10s;
        proxy_send_timeout    300s;
        proxy_read_timeout    300s;
    }

    listen 80;
    listen [::]:80;
}
